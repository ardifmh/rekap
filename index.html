<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SPPG CIKASO — Absensi & Gaji</title>

<style>
:root{
    --blue:#1769e0;
    --blue-dark:#0e55b7;
    --blue-light:#eaf2ff;
    --bg:#f4f7fb;
    --card:#fff;
    --text:#172033;
    --muted:#6b7280;
    --line:#e5e7eb;
    --green:#16834b;
    --green-bg:#dcfce7;
    --red:#d9363e;
    --red-bg:#fee2e2;
    --yellow:#92400e;
    --yellow-bg:#fef3c7;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:245px;
    background:linear-gradient(180deg,#0e55b7,#153d7a);
    color:white;
    padding:20px 14px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 8px 25px;
}

.brand-logo{
    width:48px;
    height:48px;
    border-radius:14px;
    background:white;
    padding:3px;
}

.brand-text b{
    display:block;
    font-size:15px;
}

.brand-text small{
    opacity:.8;
}

.nav button{
    width:100%;
    padding:12px 14px;
    margin:3px 0;
    border-radius:10px;
    background:transparent;
    color:#dbeafe;
    text-align:left;
    font-weight:600;
}

.nav button:hover,
.nav button.active{
    background:rgba(255,255,255,.16);
    color:white;
}

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    padding:24px;
    max-width:1600px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.top h1{
    margin:0;
    font-size:25px;
}

.top p{
    margin:5px 0 0;
    color:var(--muted);
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    padding:10px 14px;
    border-radius:9px;
    background:#eef2f7;
    color:#263246;
    font-weight:700;
}

.btn.primary{
    background:var(--blue);
    color:white;
}

.btn.green{
    background:var(--green-bg);
    color:#166534;
}

.btn.danger{
    background:var(--red-bg);
    color:#991b1b;
}

.btn.small{
    padding:7px 10px;
    font-size:12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:17px;
    box-shadow:0 4px 14px rgba(20,35,60,.04);
}

.stat small{
    color:var(--muted);
}

.stat strong{
    display:block;
    font-size:26px;
    margin-top:8px;
}

.section{
    margin-top:18px;
}

.section h2{
    font-size:18px;
    margin:0 0 12px;
}

.toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:12px;
}

.toolbar label{
    font-size:13px;
    font-weight:700;
}

.toolbar input,
.toolbar select,
.form input,
.form select{
    border:1px solid #d6dbe3;
    border-radius:9px;
    padding:10px;
    background:white;
    outline:none;
}

.toolbar input:focus,
.toolbar select:focus,
.form input:focus,
.form select:focus{
    border-color:var(--blue);
}

.tablewrap{
    overflow:auto;
    background:white;
    border:1px solid var(--line);
    border-radius:12px;
}

.table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
}

.table th,
.table td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    text-align:left;
    white-space:nowrap;
}

.table th{
    background:#f8fafc;
    font-size:13px;
    color:#475569;
}

.table tr:last-child td{
    border-bottom:0;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
}

.badge.ok{
    background:var(--green-bg);
    color:#166534;
}

.badge.warn{
    background:var(--yellow-bg);
    color:#92400e;
}

.note{
    padding:12px;
    border-radius:10px;
    background:#eff6ff;
    color:#1e40af;
    font-size:13px;
}

.empty{
    padding:30px;
    text-align:center;
    color:var(--muted);
}

.division-row td{
    background:var(--blue-light)!important;
    color:#174ea6;
    font-weight:900;
    border-top:2px solid #bfdbfe!important;
}

.division-label{
    display:flex;
    align-items:center;
    gap:8px;
}

.division-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--blue);
}

.abs{
    width:35px;
    height:35px;
    border-radius:8px;
    font-weight:800;
    background:var(--red-bg);
    color:#991b1b;
}

.abs.on{
    background:var(--green-bg);
    color:#166534;
}

.abs.izin{
    background:#fef3c7;
    color:#92400e;
}

.abs.sakit{
    background:#dbeafe;
    color:#1e40af;
}

.abs.alpa{
    background:#fee2e2;
    color:#991b1b;
}

.abs.lainnya{
    background:#ede9fe;
    color:#5b21b6;
}

.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:12px;
}

.history-header h2{
    margin:0;
}

.history-subtitle{
    margin:5px 0 0;
    color:var(--muted);
    font-size:13px;
}

.history-table{
    min-width:760px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    border-radius:16px;
    width:min(560px,100%);
    padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.form{
    display:grid;
    gap:12px;
}

.form label{
    font-size:13px;
    font-weight:700;
    color:#475569;
}

.form input,
.form select{
    width:100%;
    margin-top:5px;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:16px;
}

/* STATUS MODAL */

.status-options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin:15px 0;
}

.status-btn{
    padding:12px;
    border-radius:10px;
    font-weight:700;
}

.status-hadir{
    background:#dcfce7;
    color:#166534;
}

.status-izin{
    background:#fef3c7;
    color:#92400e;
}

.status-sakit{
    background:#dbeafe;
    color:#1e40af;
}

.status-alpa{
    background:#fee2e2;
    color:#991b1b;
}

.status-lainnya{
    background:#ede9fe;
    color:#5b21b6;
}

/* FIREBASE */

.firebase-status{
    position:fixed;
    right:18px;
    top:18px;
    z-index:200;
    padding:7px 10px;
    border-radius:999px;
    background:#fef3c7;
    color:#92400e;
    font-size:12px;
    font-weight:800;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
}

/* SLIP PREVIEW */

.slip-preview{
    background:white;
    border:1px solid #222;
    padding:15px;
    max-width:850px;
    margin:auto;
}

.receipt-head{
    display:grid;
    grid-template-columns:60px 1fr 230px;
    gap:10px;
    align-items:center;
    border-bottom:1px solid #222;
    padding-bottom:8px;
}

.receipt-logo{
    width:55px;
    height:55px;
}

.receipt-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.receipt-org{
    font-size:14px;
    line-height:1.25;
}

.receipt-org b{
    display:block;
}

.receipt-org strong{
    display:block;
}

.receipt-title{
    font-size:12px;
    line-height:1.5;
}

.receipt-title>b{
    display:block;
    font-size:14px;
    margin-bottom:4px;
}

.receipt-info{
    padding:10px 0;
    font-size:12px;
}

.receipt-info > div{
    display:grid;
    grid-template-columns:100px 15px 1fr;
    min-height:22px;
}

.receipt-total{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid #222;
    border-bottom:1px solid #222;
    padding:8px 10px;
    font-size:13px;
}

.receipt-total strong{
    font-size:14px;
}

.receipt-words{
    text-align:center;
    font-weight:800;
    font-style:italic;
    padding:8px;
    border-bottom:1px solid #222;
    text-transform:uppercase;
    font-size:12px;
}

.receipt-signatures{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:10px;
    text-align:center;
    font-size:11px;
}

.signature-space{
    height:55px;
}

.signature-col b{
    display:block;
    text-decoration:underline;
}

.signature-col span{
    display:block;
    margin-top:3px;
}

/* TOAST */

.toast{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:300;
    background:#166534;
    color:white;
    padding:12px 16px;
    border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    font-weight:700;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:900px){

    .sidebar{
        position:static;
        width:100%;
        height:auto;
    }

    .app{
        display:block;
    }

    .main{
        margin:0;
        width:100%;
        padding:15px;
    }

    .nav{
        display:flex;
        overflow:auto;
    }

    .nav button{
        min-width:max-content;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .receipt-head{
        grid-template-columns:50px 1fr;
    }

    .receipt-title{
        grid-column:1/-1;
    }
}

@media(max-width:560px){

    .grid{
        grid-template-columns:1fr;
    }

    .top{
        align-items:flex-start;
        gap:10px;
        flex-direction:column;
    }

    .receipt-signatures{
        font-size:9px;
    }

    .signature-space{
        height:40px;
    }
}

/* PRINT SLIP */

@media print{

    body{
        background:white;
    }

    .sidebar,
    .top,
    .no-print{
        display:none!important;
    }

    .main{
        margin:0;
        width:100%;
        padding:0;
    }

}

/* PRINT SLIP 4 VERTIKAL */

.print-sheet{
    width:100%;
    display:grid;
    grid-template-columns:1fr;
    gap:3mm;
    page-break-after:always;
    break-after:page;
}

.print-sheet:last-child{
    page-break-after:auto;
    break-after:auto;
}

.print-slip{
    width:100%;
    box-sizing:border-box;
    border:1px solid #222;
    padding:3mm;
    background:white;
    overflow:hidden;
    break-inside:avoid;
    page-break-inside:avoid;
}

.print-slip .receipt-head{
    grid-template-columns:17mm 1fr 57mm;
    gap:2mm;
    padding-bottom:1.5mm;
}

.print-slip .receipt-logo{
    width:15mm;
    height:15mm;
}

.print-slip .receipt-org{
    font-size:8px;
}

.print-slip .receipt-org b,
.print-slip .receipt-org strong{
    font-size:9px;
}

.print-slip .receipt-title{
    font-size:7px;
}

.print-slip .receipt-title>b{
    font-size:9px;
}

.print-slip .receipt-info{
    font-size:7px;
    padding:1.5mm 0;
}

.print-slip .receipt-info > div{
    grid-template-columns:24mm 3mm 1fr;
    min-height:3.2mm;
}

.print-slip .receipt-total{
    font-size:8px;
    padding:1.2mm 2mm;
}

.print-slip .receipt-total strong{
    font-size:9px;
}

.print-slip .receipt-words{
    font-size:7px;
    padding:1mm;
}

.print-slip .receipt-signatures{
    font-size:6.7px;
    padding-top:1.5mm;
}

.print-slip .signature-space{
    height:7mm;
}

.print-slip .signature-col b{
    font-size:6.7px;
    white-space:nowrap;
}

@page{
    size:A4 portrait;
    margin:6mm;
}
</style>
</head>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey:
        "AIzaSyC3KjTxrTfIPv4Amet5S35WDEl4mSRWTjo",

    authDomain:
        "absensi-2cd1d.firebaseapp.com",

    projectId:
        "absensi-2cd1d",

    storageBucket:
        "absensi-2cd1d.firebasestorage.app",

    messagingSenderId:
        "1089163473824",

    appId:
        "1:1089163473824:web:f109a339b27fc5cfc4aac5"

};


let firebaseApp = null;
let firebaseAuth = null;
let firestore = null;
let firebaseUser = null;
let firebaseReady = false;
let firebaseSyncing = false;
let firebaseSaveTimer = null;
let firebaseUnsubscribe = null;


function setFirebaseStatus(text,ok=false){

    const el =
        document.getElementById(
            "firebaseStatus"
        );

    if(!el) return;

    el.textContent = text;

    el.style.display = "block";

    el.style.background =
        ok ? "#dcfce7" : "#fef3c7";

    el.style.color =
        ok ? "#166534" : "#92400e";
}


try{

    firebaseApp =
        firebase.initializeApp(
            firebaseConfig
        );

    firebaseAuth =
        firebase.auth();

    firestore =
        firebase.firestore();

}catch(error){

    console.error(error);

}


async function initFirebase(){

    if(
        !firebaseAuth ||
        !firestore
    ){

        setFirebaseStatus(
            "⚠ Mode Lokal"
        );

        return;
    }

    try{

        await firebaseAuth
            .signInAnonymously();

        firebaseAuth
            .onAuthStateChanged(
                async user => {

                    if(!user) return;

                    firebaseUser = user;

                    firebaseReady = true;

                    setFirebaseStatus(
                        "☁ Firebase Terhubung",
                        true
                    );

                    await loadFromFirebase();

                    startRealtimeSync();

                }
            );

    }catch(error){

        console.error(
            "Firebase Auth:",
            error
        );

        setFirebaseStatus(
            "⚠ Mode Lokal"
        );

        showToast(
            "Firebase belum dapat digunakan."
        );

    }

}


async function loadFromFirebase(){

    if(
        !firebaseReady ||
        !firestore ||
        !firebaseUser
    ) return;

    firebaseSyncing = true;

    try{

        const ref =
            firestore
                .collection("sppgCikaso")
                .doc("appState");

        const snap =
            await ref.get();

        if(
            snap.exists &&
            snap.data().state
        ){

            const remote =
                snap.data().state;

            if(
                remote &&
                Array.isArray(
                    remote.people
                )
            ){

                db = remote;

                normalizeDB();

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(db)
                );

                showPage(
                    currentPage
                );

                showToast(
                    "☁ Data dimuat dari Firebase."
                );

            }

        }else{

            await pushToFirebase(true);

        }

    }catch(error){

        console.error(
            error
        );

        showToast(
            "⚠ Firebase gagal dibaca. Data lokal digunakan."
        );

    }finally{

        firebaseSyncing = false;

    }

}


function startRealtimeSync(){

    if(
        !firebaseReady ||
        !firestore ||
        firebaseUnsubscribe
    ) return;

    const ref =
        firestore
            .collection("sppgCikaso")
            .doc("appState");

    firebaseUnsubscribe =
        ref.onSnapshot(

            snap => {

                if(
                    firebaseSyncing ||
                    !snap.exists
                ) return;

                const remote =
                    snap.data().state;

                if(
                    !remote ||
                    !Array.isArray(
                        remote.people
                    )
                ) return;

                db = remote;

                normalizeDB();

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(db)
                );

                showPage(
                    currentPage
                );

            },

            error => {

                console.error(
                    error
                );

                setFirebaseStatus(
                    "⚠ Sinkronisasi bermasalah"
                );

            }

        );

}


async function pushToFirebase(
    initial=false
){

    if(
        !firebaseReady ||
        !firestore ||
        !firebaseUser
    ) return false;

    try{

        await firestore
            .collection("sppgCikaso")
            .doc("appState")
            .set({

                state:db,

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                updatedBy:
                    firebaseUser.uid

            });

        if(!initial){

            showToast(
                "☁ Data tersimpan ke Firebase."
            );

        }

        return true;

    }catch(error){

        console.error(
            error
        );

        showToast(
            "⚠ Gagal menyimpan ke Firebase."
        );

        return false;

    }

}


function queueFirebaseSave(){

    if(!firebaseReady) return;

    clearTimeout(
        firebaseSaveTimer
    );

    firebaseSaveTimer =
        setTimeout(
            () => pushToFirebase(false),
            400
        );

}

function periodLength(){

function periodLengthFrom(
    start,
    end
){

    if(!start || !end)
        return 1;

    const a =
        new Date(
            start+"T00:00:00"
        );

    const b =
        new Date(
            end+"T00:00:00"
        );

    return Math.max(
        1,
        Math.floor(
            (
                b-a
            ) /
            86400000
        )+1
    );

}


function money(value){

        Number(value)||0

function number(value){

function fmtDate(value){

    return new Date(
        value+"T00:00:00"
    ).toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );

}


function dateLocal(date){

}


function esc(value){

        /[&<>"']/g,
        char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",

}

    if(

    if(

function saveDashboardPeriod(){

    const start =
        document.getElementById(
            "dashboardStart"
        ).value;

    const end =
        document.getElementById(
            "dashboardEnd"
        ).value;


    if(!start || !end){

        alert(
            "Tanggal mulai dan selesai wajib diisi."
        );

        return;

    }


    if(end < start){

        alert(
            "Tanggal selesai tidak boleh sebelum tanggal mulai."
        );

        return;

    }


    const n =
        periodLengthFrom(
            start,
            end
        );


    if(n > 31){

        alert(
            "Periode maksimal 31 hari."
        );

        return;

    }


    rememberCurrentPeriod();


    db.periodeStart =
        start;

    db.periodeEnd =
        end;


    resetAttendanceForNewPeriod();


    save();

    renderDashboard();


    showToast(
        "✓ Periode disimpan dan absensi baru dibuat."
    );

}


/* ======================================================
   RIWAYAT PERIODE
   ====================================================== */

function periodKey(
    start,
    end
){

    return (
        start +
        "|" +
        end
    );

}


function snapshotCurrentPeriod(){

    return {

        start:
            db.periodeStart,

        end:
            db.periodeEnd,

        savedAt:
            new Date().toISOString(),

        people:
            db.people.map(
                person => ({

                    name:
                        person.name,

                    jabatan:
                        person.jabatan,

                    tarif:
                        Number(
                            person.tarif
                        ) || 0,

                    korve:
                        Number(
                            person.korve
                        ) || 0,

                    days:[
                        ...(person.days || [])
                    ],

                    reasons:[
                        ...(person.reasons || [])
                    ]

                })
            )

    };

}


function rememberCurrentPeriod(){

    const snapshot =
        snapshotCurrentPeriod();

    if(
        !Array.isArray(
            db.periodHistory
        )
    ){

        db.periodHistory = [];

    }


    const key =
        periodKey(
            snapshot.start,
            snapshot.end
        );


    const index =
        db.periodHistory.findIndex(
            item =>
                periodKey(
                    item.start,
                    item.end
                ) === key
        );


    if(index >= 0){

        db.periodHistory[index] =
            snapshot;

    }else{

        db.periodHistory.unshift(
            snapshot
        );

    }


    db.periodHistory =
        db.periodHistory.slice(
            0,
            24
        );

}


function historySummary(
    history
){

    let totalHadir =
        0;

    let totalPembayaran =
        0;


    (
        history.people || []
    ).forEach(
        person => {

            const tarif =
                Number(
                    person.tarif
                ) || 0;

            const korve =
                Number(
                    person.korve
                ) || 0;

            const days =
                Array.isArray(
                    person.days
                )
                ? person.days
                : [];

            const h =
                days.reduce(
                    (
                        total,
                        value
                    ) =>
                        total +
                        (
                            Number(value) === 1
                            ? 1
                            : 0
                        ),
                    0
                );


            totalHadir += h;

            totalPembayaran +=
                (
                    h * tarif
                )
                +
                korve;

        }
    );


    return {

        hadir:
            totalHadir,

        total:
            totalPembayaran

    };

}


function editHistory(index){

    const history =
        db.periodHistory[
            index
        ];


    if(!history)
        return;


    if(
        !confirm(
            "Buka periode " +
            fmtDate(history.start) +
            " — " +
            fmtDate(history.end) +
            " untuk diedit?"
        )
    ){

        return;

    }


    db.periodeStart =
        history.start;

    db.periodeEnd =
        history.end;


    const map =
        new Map(
            (
                history.people ||
                []
            ).map(
                person =>
                    [
                        person.name,
                        person
                    ]
            )
        );


    const n =
        periodLength();


    db.people.forEach(
        person => {

            const old =
                map.get(
                    person.name
                ) || {};


            person.days =
                Array.from(
                    {length:n},
                    (_,i) =>
                        (
                            old.days ||
                            []
                        )[i] || 0
                );


            person.reasons =
                Array.from(
                    {length:n},
                    (_,i) =>
                        (
                            old.reasons ||
                            []
                        )[i] || ""
                );

        }
    );


    save();

    showPage(
        "absensi"
    );


    showToast(
        "✓ Periode dibuka untuk diedit."
    );

}


function deleteHistory(index){

    const history =
        db.periodHistory[
            index
        ];


    if(!history)
        return;


    if(
        !confirm(
            "Hapus riwayat periode " +
            fmtDate(history.start) +
            " — " +
            fmtDate(history.end) +
            "?"
        )
    ){

        return;

    }


    db.periodHistory.splice(
        index,
        1
    );


    save();

    renderDashboard();


    showToast(
        "✓ Riwayat periode dihapus."
    );

}

/* ======================================================
   RESET ABSENSI PERIODE
   ====================================================== */

function defaultAttendance(
    start,
    index,
    security
){

    const date =
        new Date(
            start +
            "T00:00:00"
        );

    date.setDate(
        date.getDate() +
        index
    );


    const day =
        date.getDay();


    /* Minggu */

    if(day === 0)
        return 0;


    /* Sabtu */

    if(day === 6){

        return security
            ? 1
            : 0;

    }


    /* Senin-Jumat */

    return 1;

}


function resetAttendanceForNewPeriod(){

    const n =
        periodLength();


    db.people.forEach(
        person => {

            const security =
                divisionOf(
                    person.jabatan
                ) === "SECURITY";


            person.days =
                Array.from(
                    {
                        length:n
                    },
                    (_,i) =>
                        defaultAttendance(
                            db.periodeStart,
                            i,
                            security
                        )
                );


            person.reasons =
                Array.from(
                    {
                        length:n
                    },
                    (_,i) => {

                        const date =
                            new Date(
                                db.periodeStart +
                                "T00:00:00"
                            );

                        date.setDate(
                            date.getDate() +
                            i
                        );

                        const day =
                            date.getDay();


                        if(day === 0)
                            return "LIBUR";

                        if(
                            day === 6 &&
                            !security
                        )
                            return "LIBUR";

                        return "";

                    }
                );

        }
    );

}

/* ======================================================
   SIMPAN PERIODE ABSENSI
   ====================================================== */

function saveAbsensiPeriod(){

    const start =
        document.getElementById(
            "absStart"
        ).value;

    const end =
        document.getElementById(
            "absEnd"
        ).value;


    if(!start || !end){

        alert(
            "Tanggal mulai dan selesai wajib diisi."
        );

        return;

    }


    if(end < start){

        alert(
            "Tanggal selesai tidak boleh sebelum tanggal mulai."
        );

        return;

    }


    const n =
        periodLengthFrom(
            start,
            end
        );


    if(n > 31){

        alert(
            "Periode maksimal 31 hari."
        );

        return;

    }


    /*
     * Simpan periode lama
     * ke riwayat
     */

    rememberCurrentPeriod();


    /*
     * Buat periode baru
     */

    db.periodeStart =
        start;

    db.periodeEnd =
        end;


    resetAttendanceForNewPeriod();


    save();


    renderAbsensi();


    showToast(
        "✓ Periode disimpan. Absensi otomatis dibuat."
    );

}


/* ======================================================
   BUKA PERIODE DARI PENCARIAN
   ====================================================== */

function openHistoryFromSelect(
    key
){

    if(!key)
        return;


    const history =
        (
            db.periodHistory ||
            []
        ).find(
            item =>
                periodKey(
                    item.start,
                    item.end
                ) === key
        );


    if(!history)
        return;


    db.periodeStart =
        history.start;

    db.periodeEnd =
        history.end;


    const map =
        new Map(
            (
                history.people ||
                []
            ).map(
                person =>
                    [
                        person.name,
                        person
                    ]
            )
        );


    const n =
        periodLength();


    db.people.forEach(
        person => {

            const old =
                map.get(
                    person.name
                ) || {};


            person.days =
                Array.from(
                    {length:n},
                    (_,i) =>
                        (
                            old.days ||
                            []
                        )[i] || 0
                );


            person.reasons =
                Array.from(
                    {length:n},
                    (_,i) =>
                        (
                            old.reasons ||
                            []
                        )[i] || ""
                );

        }
    );


    save();

    renderAbsensi();

    showToast(
        "✓ Periode berhasil dibuka."
    );

}

   STATUS ABSENSI
   ====================================================== */

function openAttendance(
    index,
    dayIndex
){

    attendanceTarget = {

        index:index,

        day:dayIndex

    };


    const person =
        db.people[
            index
        ];


    const date =
        new Date(
            db.periodeStart +
            "T00:00:00"
        );

    date.setDate(
        date.getDate() +
        dayIndex
    );


    const current =
        person.days[
            dayIndex
        ]
        ? "HADIR"
        :
        (
            (
                person.reasons ||
                []
            )[dayIndex]
            ||
            "TIDAK HADIR"
        );


    document.getElementById(
        "attendanceInfo"
    ).innerHTML = `

        <b>
            ${esc(
                person.name
            )}
        </b>

        <br>

        ${dateLocal(
            date
        )}

        <br>

        Status sekarang:
        <b>
            ${current}
        </b>

    `;


    document.getElementById(
        "attendanceModal"
    ).classList.add(
        "show"
    );

}


function closeAttendanceModal(){

    document.getElementById(
        "attendanceModal"
    ).classList.remove(
        "show"
    );


    attendanceTarget = {

        index:null,

        day:null

    };

}


function setAttendance(
    status
){

    const index =
        attendanceTarget.index;

    const day =
        attendanceTarget.day;


    if(
        index === null ||
        day === null
    )
        return;


    const person =
        db.people[
            index
        ];


    if(!person)
        return;


    if(!Array.isArray(
        person.reasons
    )){

        person.reasons =
            Array.from(
                {
                    length:
                        person.days.length
                },
                () => ""
            );

    }


    if(status === "HADIR"){

        person.days[
            day
        ] = 1;

        person.reasons[
            day
        ] = "";

    }else{

        person.days[
            day
        ] = 0;

        person.reasons[
            day
        ] = status;

    }


    save();

    closeAttendanceModal();

    renderAbsensi();

    showToast(
        "✓ Status absensi diperbarui."
    );

}

/* ======================================================
   TERBILANG
   ====================================================== */

function terbilang(
    value
){

    const angka = [

        "",
        "satu",
        "dua",
        "tiga",
        "empat",
        "lima",
        "enam",
        "tujuh",
        "delapan",
        "sembilan",
        "sepuluh",
        "sebelas"

    ];


    value =
        Math.floor(
            Number(value)||0
        );


    if(value < 12)
        return angka[value];


    if(value < 20)
        return (
            terbilang(
                value-10
            )
            +
            " belas"
        );


    if(value < 100)
        return (
            terbilang(
                Math.floor(
                    value/10
                )
            )
            +
            " puluh " +
            terbilang(
                value%10
            )
        );


    if(value < 200)
        return (
            "seratus " +
            terbilang(
                value-100
            )
        );


    if(value < 1000)
        return (
            terbilang(
                Math.floor(
                    value/100
                )
            )
            +
            " ratus " +
            terbilang(
                value%100
            )
        );


    if(value < 2000)
        return (
            "seribu " +
            terbilang(
                value-1000
            )
        );


    if(value < 1000000)
        return (
            terbilang(
                Math.floor(
                    value/1000
                )
            )
            +
            " ribu " +
            terbilang(
                value%1000
            )
        );


    if(value < 1000000000)
        return (
            terbilang(
                Math.floor(
                    value/1000000
                )
            )
            +
            " juta " +
            terbilang(
                value%1000000
            )
        );


    if(value < 1000000000000)
        return (
            terbilang(
                Math.floor(
                    value/1000000000
                )
            )
            +
            " miliar " +
            terbilang(
                value%1000000000
            )
        );


    return String(value);

}

function getFilteredReport(){

    const search =
        (
            document.getElementById(
                "reportSearch"
            )?.value || ""
        )
        .toLowerCase()
        .trim();


    const division =
        document.getElementById(
            "reportDivision"
        )?.value || "";


    return db.people
        .map(
            (
                person,
                index
            ) => ({

                person,

                index,

                division:
                    divisionOf(
                        person.jabatan
                    ),

                hadir:
                    hadir(person),

                upah:
                    upah(person),

                total:
                    totalGaji(person)

            })
        )
        .filter(
            row => {

                const text =
                    (
                        row.person.name +
                        " " +
                        row.person.jabatan +
                        " " +
                        row.division
                    ).toLowerCase();


                return (

                    (
                        !search ||
                        text.includes(
                            search
                        )
                    )

                    &&

                    (
                        !division ||
                        row.division ===
                        division
                    )

                );

            }
        )
        .sort(
            (
                a,
                b
            ) =>
                a.division.localeCompare(
                    b.division
                )
                ||
                a.person.name.localeCompare(
                    b.person.name
                )
        );

}

/* ======================================================
   CSV
   ====================================================== */

function exportReportCSV(){

    const rows =
        getFilteredReport();


    const quote =
        value =>
            '"' +
            String(
                value ?? ""
            ).replace(
                /"/g,
                '""'
            ) +
            '"';


    const data = [

        [
            "Laporan / Rekap SPPG Cikaso"
        ],

        [
            "Periode",
            getPeriodText()
        ],

        [
            "No",
            "Divisi",
            "Nama",
            "Jabatan",
            "Hadir",
            "Tarif/Hari",
            "Upah",
            "Korve/GC",
            "Total Gaji"
        ],

        ...rows.map(
            row => [

                row.index+1,

                row.division,

                row.person.name,

                row.person.jabatan,

                row.hadir,

                row.person.tarif,

                row.upah,

                row.person.korve,

                row.total

            ]
        )

    ];


    const blob =
        new Blob(
            [
                "\ufeff" +
                data
                    .map(
                        row =>
                            row.map(
                                quote
                            ).join(";")
                    )
                    .join("\r\n")
            ],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href = url;

    a.download =
        "laporan_sppg_cikaso_" +
        db.periodeStart +
        "_" +
        db.periodeEnd +
        ".csv";

    a.click();


    setTimeout(
        () =>
            URL.revokeObjectURL(
                url
            ),
        1000
    );

}

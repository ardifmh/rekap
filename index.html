<script>
const firebaseConfig = {
  apiKey: "AIzaSyC3KjTxrTfIPv4Amet5S35WDEl4mSRWTjo",
  authDomain: "absensi-2cd1d.firebaseapp.com",
  projectId: "absensi-2cd1d",
  storageBucket: "absensi-2cd1d.firebasestorage.app",
  messagingSenderId: "1089163473824",
  appId: "1:1089163473824:web:f109a339b27fc5cfc4aac5"
};

let firebaseApp = null;
let firebaseAuth = null;
let firestore = null;
let firebaseUser = null;
let firebaseReady = false;
let firebaseSyncing = false;
let firebaseSaveTimer = null;
let firebaseUnsubscribe = null;
function setFirebaseStatus(text, ok=false) {
  const el=document.getElementById('firebaseStatus');
  if(!el)return;
  el.textContent=text;
  el.style.display='block';
  el.style.background=ok?'#dcfce7':'#fef3c7';
  el.style.color=ok?'#166534':'#92400e';
}

try {
  firebaseApp = firebase.initializeApp(firebaseConfig);
  firebaseAuth = firebase.auth();
  firestore = firebase.firestore();
} catch (err) {
  console.error('Firebase gagal diinisialisasi:', err);
}

async function initFirebase() {
  if (!firebaseAuth || !firestore) {
    setFirebaseStatus('⚠ Mode lokal', false);
    showToast('⚠ Firebase belum terhubung. Aplikasi tetap menggunakan penyimpanan lokal.');
    return;
  }

  try {
    await firebaseAuth.signInAnonymously();
    firebaseAuth.onAuthStateChanged(async user => {
      if (!user || firebaseSyncing) return;
      firebaseUser = user;
      firebaseReady = true;
      setFirebaseStatus('☁ Firebase terhubung', true);
      await loadFromFirebase();
    });
  } catch (err) {
    console.error('Anonymous Auth gagal:', err);
    setFirebaseStatus('⚠ Mode lokal', false);
    showToast('⚠ Firebase tidak dapat tersambung. Data tetap disimpan lokal.');
  }
}

async function loadFromFirebase() {
  if (!firebaseReady || !firestore || !firebaseUser) return;
  firebaseSyncing = true;
  try {
    const ref = firestore.collection('sppgCikaso').doc('appState');
    const snap = await ref.get();
    if (snap.exists && snap.data().state) {
      const remote = snap.data().state;
      if (remote && Array.isArray(remote.people)) {
        db = remote;
        db.periodHistory = Array.isArray(db.periodHistory) ? db.periodHistory : [];
        normalizeDb();
        localStorage.setItem(KEY, JSON.stringify(db));
        showPage(currentPage || 'dashboard');
        showToast('☁ Data SPPG berhasil dimuat dari Firebase');
      }
    } else {
      await pushToFirebase(true);
      showToast('☁ Data awal SPPG tersimpan di Firebase');
    }
  } catch (err) {
    console.error('Gagal membaca Firestore:', err);
    showToast('⚠ Gagal membaca Firebase. Data lokal tetap digunakan.');
  } finally {
    firebaseSyncing = false;
  }
}

function startRealtimeSync() {
  if (!firebaseReady || !firestore || firebaseUnsubscribe) return;
  const ref = firestore.collection('sppgCikaso').doc('appState');
  firebaseUnsubscribe = ref.onSnapshot(snap => {
    if (!snap.exists || !snap.data().state || firebaseSyncing) return;
    const remote = snap.data().state;
    if (!remote || !Array.isArray(remote.people)) return;
    db = remote;
    normalizeDb();
    localStorage.setItem(KEY, JSON.stringify(db));
    if (typeof currentPage !== 'undefined' && currentPage) showPage(currentPage);
  }, err => {
    console.error('Realtime Firestore error:', err);
    setFirebaseStatus('⚠ Sinkronisasi bermasalah', false);
  });
}

function normalizeDb() {
  db.periodHistory = Array.isArray(db.periodHistory) ? db.periodHistory : [];
  const n = periodLength();
  db.people = Array.isArray(db.people) ? db.people : [];
  db.people.forEach(p => {
    p.days = Array.from({length:n}, (_,i) => Array.isArray(p.days) ? (p.days[i] ?? 0) : 0);
    p.reasons = Array.from({length:n}, (_,i) => Array.isArray(p.reasons) ? (p.reasons[i] ?? '') : '');
  });
}

async function pushToFirebase(initial=false) {
  if (!firebaseReady || !firestore || !firebaseUser) return false;
  try {
    await firestore.collection('sppgCikaso').doc('appState').set({
      state: db,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: firebaseUser.uid
    });
    if (!initial) showToast('☁ Data tersimpan ke Firebase');
    return true;
  } catch (err) {
    console.error('Gagal menyimpan ke Firestore:', err);
    showToast('⚠ Gagal menyimpan ke Firebase. Data lokal tetap aman.');
    return false;
  }
}

function queueFirebaseSave() {
  if (!firebaseReady) return;
  clearTimeout(firebaseSaveTimer);
  firebaseSaveTimer = setTimeout(() => pushToFirebase(false), 350);
}

// Mulai koneksi Firebase tanpa menampilkan halaman login.
setTimeout(initFirebase, 0);
</script>

function num(n){return new Intl.NumberFormat('id-ID').format(Number(n)||0)}
function fmtDate(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}
function periodLength(){if(!db.periodeStart||!db.periodeEnd)return 1;return Math.floor((new Date(db.periodeEnd)-new Date(db.periodeStart))/86400000)+1}
function period(){return fmtDate(db.periodeStart)+' — '+fmtDate(db.periodeEnd)}
function hadir(p){return (p.days||[]).reduce((a,b)=>a+(b===1?1:0),0)}

function total(p){return upah(p)+(Number(p.korve)||0)}

 n=Math.floor(Number(n)||0); if(n===0)return'NOL RUPIAH';
 const u=['','SATU','DUA','TIGA','EMPAT','LIMA','ENAM','TUJUH','DELAPAN','SEMBILAN','SEPULUH','SEBELAS'];
 function f(x){if(x<12)return u[x];if(x<20)return u[x-10]+' BELAS';if(x<100)return u[Math.floor(x/10)]+' PULUH '+f(x%10);if(x<200)return'SERATUS '+f(x-100);if(x<1000)return u[Math.floor(x/100)]+' RATUS '+f(x%100);if(x<2000)return'SERIBU '+f(x-1000);if(x<1000000)return f(Math.floor(x/1000))+' RIBU '+f(x%1000);if(x<2000000)return'SATU JUTA '+f(x-1000000);return f(Math.floor(x/1000000))+' JUTA '+f(x%1000000)}
 return f(n).replace(/\s+/g,' ').trim()+' RUPIAH'
}

function filterRelawan(){const q=(document.getElementById('search')?.value||'').toLowerCase();const d=document.getElementById('divisionFilter')?.value||'';fillRelawan(db.people.filter(p=>(!q||(p.name+' '+p.jabatan).toLowerCase().includes(q))&&(!d||divisionOf(p.jabatan)===d)))}

function closeModal(){document.getElementById('modal').classList.remove('show')}

function delPerson(i){if(confirm('Hapus '+db.people[i].name+'?')){db.people.splice(i,1);save();renderRelawan()}}

function periodKey(s,e){return s+'|'+e}
function snapshotCurrentPeriod(){return {start:db.periodeStart,end:db.periodeEnd,savedAt:new Date().toISOString(),people:db.people.map(p=>({name:p.name,days:[...(p.days||[])],reasons:[...(p.reasons||[])]}))}}
function rememberPeriod(){const snap=snapshotCurrentPeriod();db.periodHistory=Array.isArray(db.periodHistory)?db.periodHistory:[];const k=periodKey(snap.start,snap.end);const idx=db.periodHistory.findIndex(x=>periodKey(x.start,x.end)===k);if(idx>=0)db.periodHistory[idx]=snap;else db.periodHistory.unshift(snap);db.periodHistory=db.periodHistory.slice(0,24)}
function renderAbsensi(){
 const isDefault=db.periodeStart==='2026-09-13'&&db.periodeEnd==='2026-09-25';
 const histories=(db.periodHistory||[]).filter(x=>x.start&&x.end);
 document.getElementById('content').innerHTML=`<div class="toolbar">
 <label>Periode Cepat <select id="periodSelect" onchange="changePeriod(this.value)"><option value="">Pilih periode...</option><option value="2026-09-13|2026-09-25" ${isDefault?'selected':''}>13 - 25 September 2026</option><option value="custom">Periode lain...</option></select></label>

 <input id="absSearch" placeholder="Cari nama..." oninput="filterAbs()">

 <div class="tablewrap"><table class="table" style="min-width:1350px"><thead><tr><th>No</th><th>Nama</th>${db.people[0]?.days.map((_,i)=>`<th>${dayLabelIndex(i)}<br><small>${dateAt(i)}</small></th>`).join('')}<th>Total</th></tr></thead><tbody id="absBody"></tbody></table></div>`;

function dayLabelIndex(i){const d=new Date(db.periodeStart+'T00:00:00');d.setDate(d.getDate()+i);return ['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()]}
function dateAt(i){const d=new Date(db.periodeStart+'T00:00:00');d.setDate(d.getDate()+i);return d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit'})}
function changePeriod(v){if(!v)return;if(v==='custom'){document.getElementById('absStart').focus();return}const a=v.split('|');document.getElementById('absStart').value=a[0];document.getElementById('absEnd').value=a[1]}
function loadSavedPeriod(k){if(!k)return;const h=(db.periodHistory||[]).find(x=>periodKey(x.start,x.end)===k);if(!h)return;db.periodeStart=h.start;db.periodeEnd=h.end;const byName=new Map((h.people||[]).map(p=>[p.name,p]));const n=periodLength();db.people.forEach(p=>{const old=byName.get(p.name)||{};p.days=Array.from({length:n},(_,i)=>(old.days||[])[i]||0);p.reasons=Array.from({length:n},(_,i)=>(old.reasons||[])[i]||'')});save();renderAbsensi();showToast('✓ Periode dibuka: '+fmtDate(h.start)+' — '+fmtDate(h.end))}
function defaultAttendanceForDate(start,index,isSecurity){
 const d=new Date(start+'T00:00:00');d.setDate(d.getDate()+index);
 const dow=d.getDay(); // 0 Minggu, 6 Sabtu
 if(dow===0)return 0;
 if(dow===6)return isSecurity?1:0;
 return 1;
}
function setAbsPeriod(){
 const s=document.getElementById('absStart').value;const e=document.getElementById('absEnd').value;
 if(!s||!e)return alert('Tanggal mulai dan selesai wajib diisi.');if(e<s)return alert('Periode tidak valid: tanggal selesai tidak boleh sebelum tanggal mulai.');
 const n=Math.floor((new Date(e)-new Date(s))/86400000)+1;if(n<1||n>31)return alert('Periode maksimal 31 hari.');
 // Simpan periode yang sedang berjalan ke pencarian/riwayat sebelum membuat periode baru.
 rememberPeriod();
 db.periodeStart=s;db.periodeEnd=e;
 // Periode baru: hari kerja otomatis HADIR (hijau). Sabtu-Minggu LIBUR (merah),
 // kecuali Security tetap HADIR pada Sabtu dan LIBUR hanya pada Minggu.
 db.people.forEach(p=>{const security=divisionOf(p.jabatan)==='SECURITY';p.days=Array.from({length:n},(_,i)=>defaultAttendanceForDate(s,i,security));p.reasons=Array.from({length:n},(_,i)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+i);const dow=d.getDay();return dow===0?'LIBUR':(dow===6&&!security?'LIBUR':'')})});
 if(!save())return;
 renderAbsensi();showToast('✓ Periode disimpan. Hari kerja otomatis HADIR; Sabtu/Minggu LIBUR, Security tetap HADIR Sabtu.');
}

     html+=`<tr><td>${no}</td><td><b>${esc(p.name)}</b></td>${p.days.map((v,j)=>{const reason=(p.reasons||[])[j]||'';const title=v?'Hadir — klik untuk mengubah status':(reason?('Tidak hadir: '+reason+' — klik untuk mengubah status'):'Tidak hadir — klik untuk memilih keterangan');return `<td><button type="button" class="abs ${v?'on':''}" title="${esc(title)}" onclick="toggleAbs(${i},${j})">${v?'✓':absReasonLabel(reason)}</button></td>`}).join('')}<td><b>${hadir(p)}</b></td></tr>`;
   });
 });
 document.getElementById('absBody').innerHTML=html||`<tr><td colspan="${cols+3}" class="empty">Tidak ada data relawan.</td></tr>`;
}

  .sheet:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>${body}</body>
</html>`);
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); },700);
}

function reportRows(){return db.people.map((p,i)=>({p,i,division:(typeof getDivisi==='function'?getDivisi(p):p.jabatan||'LAINNYA'),h:hadir(p),w:upah(p),t:total(p)}))}
function reportTable(rows,print=false){
 let last='',out='';
 rows.forEach(r=>{
  if(r.division!==last){last=r.division;out+=`<tr class="division-row"><td colspan="9">DIVISI ${esc(last)}</td></tr>`}
  out+=`<tr><td>${r.i+1}</td><td>${esc(r.p.name)}</td><td>${esc(r.p.jabatan)}</td><td>${r.h}</td><td>${money(r.p.tarif)}</td><td>${money(r.w)}</td><td>${money(r.p.korve)}</td><td><b>${money(r.t)}</b></td>${print?'':'<td><button class="btn small primary" onclick="printSlip('+r.i+',getPaperSize())">Cetak Slip</button></td>'}</tr>`;
 });return out;
}
function reportSummary(rows){const h=rows.reduce((a,r)=>a+r.h,0),w=rows.reduce((a,r)=>a+r.w,0),k=rows.reduce((a,r)=>a+(Number(r.p.korve)||0),0);return {h,w,k,t:w+k}}
function renderSlip(){
 const all=reportRows(), divisions=[...new Set(all.map(r=>r.division))].sort((a,b)=>a.localeCompare(b,'id'));
 document.getElementById('content').innerHTML=`<div class="toolbar no-print"><input id="reportSearch" placeholder="Cari nama / jabatan..." oninput="fillReport()"><select id="reportDivision" onchange="fillReport()"><option value="">Semua Divisi</option>${divisions.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}</select><label>Ukuran Kertas <select id="paperSize"><option value="A4">A4</option><option value="F4">F4</option></select></label><button class="btn primary" onclick="printReport()">🖨️ Cetak Rekap</button><button class="btn green" onclick="exportReportCSV()">⬇ Export CSV</button><button class="btn" onclick="printAllSlips(getPaperSize())">Cetak Semua Slip (4/Lembar)</button></div><div class="note">Rekap seluruh relawan untuk periode <b>${period()}</b>. Filter divisi dan pencarian juga berlaku saat mencetak rekap dan mengekspor CSV. Slip per relawan tetap tersedia di Rekap Gaji.</div><div id="reportSummary" class="grid section"></div><div class="tablewrap section"><table class="table"><thead><tr><th>No</th><th>Nama</th><th>Jabatan</th><th>Hadir</th><th>Tarif/Hari</th><th>Upah</th><th>Korve/GC</th><th>Total Gaji</th><th>Aksi</th></tr></thead><tbody id="reportBody"></tbody><tfoot id="reportFoot"></tfoot></table></div>`;
 fillReport();
}
function filteredReport(){const q=(document.getElementById('reportSearch')?.value||'').trim().toLowerCase(),d=document.getElementById('reportDivision')?.value||'';return reportRows().filter(r=>(!d||r.division===d)&&(!q||[r.p.name,r.p.jabatan,r.division].some(x=>String(x||'').toLowerCase().includes(q)))).sort((a,b)=>a.division.localeCompare(b.division,'id')||a.p.name.localeCompare(b.p.name,'id'))}
function fillReport(){const rows=filteredReport(),s=reportSummary(rows);document.getElementById('reportSummary').innerHTML=`<div class="card stat"><small>Jumlah Relawan</small><strong>${num(rows.length)}</strong></div><div class="card stat"><small>Total Hari Hadir</small><strong>${num(s.h)}</strong></div><div class="card stat"><small>Total Upah</small><strong>${money(s.w)}</strong></div><div class="card stat"><small>Total Pembayaran</small><strong>${money(s.t)}</strong></div>`;document.getElementById('reportBody').innerHTML=reportTable(rows)||'<tr><td colspan="9" class="empty">Tidak ada relawan.</td></tr>';document.getElementById('reportFoot').innerHTML=`<tr style="background:#eff6ff;font-weight:900"><td colspan="3">TOTAL KESELURUHAN (${rows.length} RELAWAN)</td><td>${num(s.h)}</td><td></td><td>${money(s.w)}</td><td>${money(s.k)}</td><td>${money(s.t)}</td><td></td></tr>`}
function printReport(){const rows=filteredReport(),s=reportSummary(rows),paper=getPaperSize(),size=paper==='F4'?'215.9mm 330.2mm':'A4';const w=window.open('','_blank');if(!w){alert('Izinkan popup untuk mencetak laporan.');return}w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Rekap Gaji SPPG Cikaso</title><style>@page{size:${size} landscape;margin:10mm}body{font:10px Arial;color:#172033}h2,p{text-align:center;margin:5px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #555;padding:5px;text-align:left}th{background:#eee}.division-row td{background:#eaf2ff;font-weight:bold}tfoot{font-weight:bold;background:#eff6ff}tr{break-inside:avoid}</style></head><body><h2>BADAN GIZI NASIONAL</h2><p>SATUAN PELAYANAN PEMENUHAN GIZI (SPPG) CIKASO</p><h2>LAPORAN / REKAP GAJI SELURUH RELAWAN</h2><p>Periode: ${period()}</p><table><thead><tr><th>No</th><th>Nama</th><th>Jabatan</th><th>Hadir</th><th>Tarif/Hari</th><th>Upah</th><th>Korve/GC</th><th>Total</th></tr></thead><tbody>${reportTable(rows,true)}</tbody><tfoot><tr><td colspan="3">TOTAL (${rows.length} RELAWAN)</td><td>${s.h}</td><td></td><td>${money(s.w)}</td><td>${money(s.k)}</td><td>${money(s.t)}</td></tr></tfoot></table><p style="text-align:right;margin-top:25px">Kepala SPPG Cikaso<br><br><br><b><u>Irwan Sofyan,S.IP</u></b><br>NIP. 199705242026211020</p></body></html>`);w.document.close();setTimeout(()=>{w.focus();w.print()},500)}
function exportReportCSV(){const rows=filteredReport(),s=reportSummary(rows),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const lines=[['Laporan Rekap Gaji SPPG Cikaso'],['Periode',period()],['No','Divisi','Nama','Jabatan','Hadir','Tarif/Hari','Upah','Korve/GC','Total Gaji'],...rows.map(r=>[r.i+1,r.division,r.p.name,r.p.jabatan,r.h,r.p.tarif,r.w,r.p.korve,r.t]),['TOTAL','','','',s.h,'',s.w,s.k,s.t]];const blob=new Blob(['\ufeff'+lines.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rekap_gaji_sppg_'+db.periodeStart+'_'+db.periodeEnd+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_sppg_cikaso.json';a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm('Kembalikan data ke data awal dari Excel?')){db=structuredClone(SEED);save();showPage('dashboard')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
showPage('dashboard');
</script>
